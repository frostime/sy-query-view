    title: 总体成功标准 / 推进深度
    prio: P0
    status: hang
    note: 里程碑处拍板走到哪一步（N1 PoC 或 N4 或 N5 集成）
  - id: I-02
    title: 结项复核的定位与时机（原则确认）
    prio: P0
    status: hang
    note: 用户定义：本轮结尾（如 N6 阶段）派 subagent 复核，或写可长期复用的检测脚本；原则已定（第 1 层结束时要有验证手段），细节不提前敲死；对应节点可预订、后置。见 TERM.md『结项复核』
