# optimize-qv-agent-infra — Issue 候选池
# 性质（重要）：
#   这不是承诺清单，是「当前阶段梳理出的候选」。绝大多数 issue 不是必须做，
#   可处理、可抛弃、可随时间新增。何时处理、是否处理，由推进过程与用户决策决定。
# 术语定义与对照见同目录 TERM.md（语义对齐 / 第1层第2层 / 参考文档 / 生成器 /
# 注册调用点 / 结项复核 / wrapped 列表 / 坑清单 / breaking change 文档）。
# 本文件由 gen-issues.py 生成：改内容请改脚本数据后 `python .dev/changes/optimize-qv-agent-infra/gen-issues.py`。
meta:
  purpose: 候选 issue 池：可处理、可抛弃、可新增
  status_values:
  - open
  - hang
  - active
  - done
  - wontfix
  prio_values:
  - P0
  - P1
  - P2
  - info
domains:
- key: milestone
  title: 决策里程碑（悬空优先，需用户拍板）
  issues:
  - id: I-00
    title: 总体成功标准 / 推进深度
    prio: P0
    status: hang
    note: 里程碑处拍板走到哪一步（N1 PoC 或 N4 或 N5 集成）
  - id: I-02
    title: 结项复核的定位与时机（原则确认）
    prio: P0
    status: hang
    note: 用户定义：本轮结尾（如 N6 阶段）派 subagent 复核，或写可长期复用的检测脚本；原则已定（第 1 层结束时要有验证手段），细节不提前敲死；对应节点可预订、后置。见 TERM.md『结项复核』
  - id: I-03
    title: 2.0 全新 API 骨架
    prio: P0
    status: hang
    ev: user
    note: 明确排除在本任务外，独立 backlog；防止本任务范围蔓延
- key: n1
