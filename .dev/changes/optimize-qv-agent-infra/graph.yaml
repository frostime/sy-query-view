runtime_rules:
  - graph.yaml 唯一写入者：supervisor；用户（target authority）只改目标与成功标准
  - 节点结果须经 supervisor 验收后进入 accepted_state；验收不授权、授权靠证据
  - 只读探索可 out-of-graph；写入共享状态/不可逆动作须先入图
  - 用户偏好：参考（签名+要点，grep 定位）→ 教程 → 源码/GitHub 后备；
    README 是纯用户门面，勿擅自加 Agent 入口
  - 环境陷阱：NODE_ENV=development vite build 会被 livereload 挂起；tsconfig strict:false
    下判别联合窄化失效，用 in 操作符；types.d.ts 是构建产物，提交时单独 chore commit；
    export-types 须经 pnpm/npm run 执行（直接 node scripts/export-types.js 会命中全局
    tsc 6，报 TS5011/TS5107）；验证统一用 pnpm gen-ref:check