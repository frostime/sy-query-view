<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="qv-title qv-desc">
  <title id="qv-title">Query 与 DataView 关系图</title>
  <desc id="qv-desc">JS 嵌入块收到 Query 对象：Query 含查询方法与 Utils，并通过 DataView(protyle, item, top) 创建 DataView 实例；DataView 含 markdown/list/table/mermaid/echarts 等渲染方法；CustomView 可注册进 DataView 作为 dv.xxx() 使用。</desc>

  <!-- 语言中立：仅代码标识符（中英页面共用同一张图）。
       关系用包含（卡片容纳方法列表）+ 两条语义边表达，不再为每个方法画扇出连线。 -->

  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#202124"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>

  <!-- 入口提示：嵌入块收到的对象 -->
  <text x="90" y="50" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="13" fill="#5f6368">//!js embedded block</text>

  <!-- ============ Query 卡片 ============ -->
  <g id="node-query">
    <rect x="60" y="70" width="300" height="410" rx="14" fill="#ffffff" stroke="#202124" stroke-width="2"/>
    <text x="90" y="110" font-size="22" font-weight="600" fill="#202124">Query</text>
    <line x1="90" y1="126" x2="330" y2="126" stroke="#dadce0" stroke-width="1.2"/>

    <!-- 查询方法组（包含关系，无扇出连线） -->
    <text x="90" y="152" font-size="13" fill="#5f6368">queries</text>
    <g font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="15" fill="#202124">
      <text x="92" y="178">sql</text>
      <text x="92" y="202">backlink</text>
      <text x="92" y="226">childDoc</text>
      <text x="92" y="250">random</text>
      <text x="92" y="274">thisDoc</text>
      <text x="92" y="298" fill="#5f6368">…</text>
    </g>

    <line x1="90" y1="318" x2="330" y2="318" stroke="#dadce0" stroke-width="1.2"/>

    <!-- 工具组 -->
    <text x="90" y="340" font-size="13" fill="#5f6368">utils</text>
    <g font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="14" fill="#202124">
      <text x="92" y="362">Date · now · today · …</text>
      <text x="92" y="384">asLink · asRef · asMap · …</text>
    </g>

    <!-- 工厂方法：主关系箭头的起点 -->
    <rect x="80" y="404" width="260" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="210" y="428" text-anchor="middle" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#202124">DataView(protyle, item, top)</text>
    <text x="210" y="448" text-anchor="middle" font-size="12" fill="#5f6368">returns DataView</text>
  </g>

  <!-- ============ DataView 卡片 ============ -->
  <g id="node-dataview">
    <rect x="540" y="70" width="300" height="410" rx="14" fill="#ffffff" stroke="#202124" stroke-width="2"/>
    <text x="570" y="110" font-size="22" font-weight="600" fill="#202124">DataView</text>
    <line x1="570" y1="126" x2="810" y2="126" stroke="#dadce0" stroke-width="1.2"/>

    <!-- 渲染方法组 -->
    <text x="570" y="152" font-size="13" fill="#5f6368">render</text>
    <g font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="15" fill="#202124">
      <text x="572" y="178">markdown</text>
      <text x="572" y="202">list</text>
      <text x="572" y="226">table</text>
      <text x="572" y="250">mermaid</text>
      <text x="572" y="274">echarts</text>
      <text x="572" y="298">addElement</text>
      <text x="572" y="322" fill="#5f6368">…</text>
    </g>

    <line x1="570" y1="342" x2="810" y2="342" stroke="#dadce0" stroke-width="1.2"/>

    <!-- 生命周期 -->
    <text x="570" y="364" font-size="13" fill="#5f6368">lifecycle</text>
    <g font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="14" fill="#202124">
      <text x="572" y="386">render() · addDisposer()</text>
    </g>

    <!-- 自定义视图挂载位提示 -->
    <text x="570" y="430" font-size="13" fill="#5f6368">custom (registered)</text>
    <text x="572" y="452" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="14" fill="#202124">dv.xxx() · dv.addXxx()</text>
  </g>

  <!-- ============ 主关系：Query.DataView() → DataView ============ -->
  <polyline points="340,432 440,432 440,275 540,275" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <rect x="452" y="262" width="68" height="24" rx="12" fill="#dbeafe"/>
  <text x="486" y="279" text-anchor="middle" font-size="13" fill="#1d4ed8">creates</text>

  <!-- ============ 次关系：CustomView →(Register)→ DataView ============ -->
  <g id="node-customview">
    <rect x="540" y="510" width="300" height="70" rx="14" fill="#ffffff" stroke="#202124" stroke-width="2"/>
    <text x="570" y="542" font-size="17" font-weight="600" fill="#202124">CustomView</text>
    <text x="570" y="564" font-size="13" fill="#5f6368">user-defined view · use()</text>
  </g>
  <line x1="690" y1="510" x2="690" y2="482" stroke="#202124" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dark)"/>
  <rect x="704" y="486" width="78" height="24" rx="12" fill="#f1f3f4"/>
  <text x="743" y="503" text-anchor="middle" font-size="13" fill="#202124">Register</text>

  <!-- ============ 图例 ============ -->
  <g font-size="13" fill="#5f6368">
    <line x1="60" y1="540" x2="92" y2="540" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-accent)"/>
    <text x="100" y="544">primary: creates instance</text>
    <line x1="60" y1="566" x2="92" y2="566" stroke="#202124" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dark)"/>
    <text x="100" y="570">extension: register custom view</text>
  </g>
</svg>
